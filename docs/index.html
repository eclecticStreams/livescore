<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LiveScore</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:0 18px;background:#f5f7fb;color:#172033}.card{background:#fff;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;font-weight:700}.teams span:last-child{text-align:right}.score{font-size:20px}.muted{color:#697386}.filters{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}select{padding:10px;border:1px solid #d7dce5;border-radius:8px}</style></head><body><h1>LiveScore</h1><p class="muted">Live ESPN data · <span id="updated">loading…</span></p><div class="filters"><select id="date"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="tomorrow">Tomorrow</option></select><select id="status"><option value="all">All matches</option><option value="live">Live now</option><option value="scheduled">Upcoming</option><option value="finished">Finished</option></select></div><main id="app">Loading…</main><script>const API='https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard';let all=[];function key(o){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10).replaceAll('-','')}function norm(e){const c=e.competitions?.[0],t=c?.competitors||[],h=t.find(x=>x.homeAway==='home')||t[0]||{},a=t.find(x=>x.homeAway==='away')||t[1]||{},s=e.status?.type;return {league:'Premier League',status:s?.state==='in'?'live':s?.completed?'finished':'scheduled',minute:s?.detail,kickoff:e.date,home:{name:h.team?.displayName||'Home',score:h.score||0},away:{name:a.team?.displayName||'Away',score:a.score||0}}}function draw(){const s=status.value,d=all.filter(m=>s==='all'||m.status===s);app.innerHTML=d.length?d.map(m=>'<article class="card"><small>'+m.league+' · '+m.status.toUpperCase()+'</small><div class="teams"><span>'+m.home.name+'</span><span class="score">'+m.home.score+' – '+m.away.score+'</span><span>'+m.away.name+'</span></div><p class="muted">'+(m.minute||new Date(m.kickoff).toLocaleString())+'</p></article>').join(''):'<p>No matches found</p>'}async function load(){try{const o=date.value==='yesterday'?-1:date.value==='tomorrow'?1:0,r=await fetch(API+'?dates='+key(o)),d=await r.json();all=(d.events||[]).map(norm);draw();updated.textContent='updated '+new Date().toLocaleTimeString()}catch(e){app.textContent='Unable to connect to ESPN'}}date.onchange=load;status.onchange=draw;load();setInterval(load,60000)</script></body></html>

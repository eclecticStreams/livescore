<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LiveScore</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:0 18px;background:#f5f7fb;color:#172033}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}select{padding:10px;border:1px solid #d7dce5;border-radius:8px;background:white}.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center;font-weight:700}.teams span:last-child{text-align:right}.score{font-size:20px}.muted{color:#697386}.live{color:#d93025}.empty{text-align:center;padding:30px}</style></head><body><h1>LiveScore</h1><p class="muted">Powered by ESPN via Cloudflare Worker · <span id="updated">loading…</span></p><div class="filters"><select id="date"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="tomorrow">Tomorrow</option></select><select id="status"><option value="all">All matches</option><option value="live">Live now</option><option value="scheduled">Upcoming</option><option value="finished">Finished</option></select><select id="league"><option value="all">All competitions</option></select></div><main id="app">Loading…</main><script>const API='https://YOUR-WORKER.workers.dev';let all=[];function draw(){const s=status.value,l=league.value;const data=all.filter(m=>(s==='all'||m.status===s)&&(l==='all'||m.leagueCode===l));app.innerHTML=data.length?data.map(m=>'<article class="card"><small>'+m.league+' · '+m.status.toUpperCase()+'</small><div class="teams"><span>'+m.home.name+'</span><span class="score">'+m.home.score+' – '+m.away.score+'</span><span>'+m.away.name+'</span></div><p class="muted">'+(m.minute||new Date(m.kickoff).toLocaleString())+'</p></article>').join(''):'<div class="empty">No matches found</div>'}async function load(){try{const r=await fetch(API+'/api/v1/matches?all=true&date='+date.value);const d=await r.json();all=d.data||[];league.innerHTML='<option value="all">All competitions</option>'+[...new Map(all.map(m=>[m.leagueCode,m.league])).entries()].map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');draw();updated.textContent='updated '+new Date().toLocaleTimeString()}catch(e){app.textContent='Unable to connect to API'}}date.onchange=load;status.onchange=draw;league.onchange=draw;load();setInterval(load,60000)</script></body></html>
